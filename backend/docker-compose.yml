services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swasthya
      POSTGRES_PASSWORD: swasthya
      POSTGRES_DB: swasthyasetu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swasthya -d swasthyasetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://swasthya:swasthya@postgres:5432/swasthyasetu
      DATABASE_URL_SYNC: postgresql+psycopg2://swasthya:swasthya@postgres:5432/swasthyasetu
      SECRET_KEY: local-dev-secret-key-not-for-production-use-32chars
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
